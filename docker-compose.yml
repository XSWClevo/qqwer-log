services:
  # 后端 API
  backend:
    build:
      context: ./log-analysis-backend
    image: log-analysis-backend:local
    container_name: log-analysis-backend
    dns:
      - 8.8.8.8
      - 114.114.114.114
      - 223.5.5.5
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=MWLOGDB_ANALYSIS
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=12345678
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_SERVICE_URL=http://ai-service:8001
      - JAVA_OPTS=-Xms512m -Xmx1g
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - log-analysis-network

  # 前端 Web
  frontend:
    build:
      context: ./log-analysis-frontend
    image: log-analysis-frontend:local
    container_name: log-analysis-frontend
    dns:
      - 8.8.8.8
      - 114.114.114.114
      - 223.5.5.5
    ports:
      - "50080:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - log-analysis-network

  # PostgreSQL (业务数据库)
  postgres:
    image: docker.1ms.run/postgres:15
    container_name: log-analysis-postgres
    dns:
      - 8.8.8.8
      - 114.114.114.114
      - 223.5.5.5
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/postgresql/docker-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - log-analysis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ClickHouse (日志数据库)
  clickhouse:
    image: docker.1ms.run/clickhouse/clickhouse-server:25.6
    container_name: log-analysis-clickhouse
    dns:
      - 8.8.8.8
      - 114.114.114.114
      - 223.5.5.5
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=MWLOGDB_ANALYSIS
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=12345678
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./database/clickhouse/docker-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - log-analysis-network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (缓存)
  redis:
    image: docker.1ms.run/redis:7-alpine
    container_name: log-analysis-redis
    dns:
      - 8.8.8.8
      - 114.114.114.114
      - 223.5.5.5
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - log-analysis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  clickhouse-data:
  redis-data:

networks:
  log-analysis-network:
    driver: bridge
