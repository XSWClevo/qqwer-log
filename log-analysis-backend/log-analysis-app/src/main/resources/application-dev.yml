server:
  port: 8080
  tomcat:
    connection-timeout: 60000  # Tomcat连接超时(毫秒) - 60秒

spring:
  application:
    name: log-analysis-app

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # 动态数据源配置
  datasource:
    dynamic:
      primary: postgres  # 默认数据源
      strict: false  # 严格模式
      datasource:
        # PostgreSQL数据源（元数据库）
        postgres:
          driver-class-name: org.postgresql.Driver
          url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
          username: ${DB_USER:postgres}
          password: ${DB_PASSWORD:postgres}
          hikari:
            maximum-pool-size: 20
            minimum-idle: 5
            connection-timeout: 30000

        # ClickHouse数据源（日志数据库）
        clickhouse:
          driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
          url: jdbc:clickhouse://${CLICKHOUSE_HOST:clickhouse.qqwer-log.orb.local}:${CLICKHOUSE_PORT:8123}/${CLICKHOUSE_DB:default}
          username: ${CLICKHOUSE_USER:default}
          password: ${CLICKHOUSE_PASSWORD:12345678}
          hikari:
            maximum-pool-size: 10
            minimum-idle: 2
            connection-timeout: 10000

  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    user: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # Kafka配置
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:10.18.5.186:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 3
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: log-analysis-group
      auto-offset-reset: earliest

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          ssl:
            enable: ${MAIL_SMTP_SSL:false}
          connectiontimeout: 10000
          timeout: 15000
          writetimeout: 15000

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: cn.mw.loganalysis.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    # JSONB 类型支持
    jdbc-type-for-null: OTHER
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-token-generation-change-it-in-production}
  expiration: 900000  # 15分钟 (毫秒)
  refresh-expiration: 604800000  # 7天 (毫秒)

# 日志提取配置
extraction:
  batch-size: 1000  # 批量读取日志数量
  schedule-interval: 10000  # 定时任务间隔(毫秒)

# 告警配置
alert:
  evaluation-interval: 5000  # 告警评估间隔(毫秒)
  default-silence-period: 300  # 默认静默期(秒)

# AI服务配置
ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8001}  # AI服务地址
    timeout: 60000  # 超时时间(毫秒) - 60秒，适配AI查询等长时间操作

agent:
  llm:
    enabled: ${AGENT_LLM_ENABLED:true}
    manual-chat-model: ${AGENT_LLM_MANUAL_CHAT_MODEL:false}
    fallback-on-error: ${AGENT_LLM_FALLBACK_ON_ERROR:true}
    memory:
      max-tokens: ${AGENT_LLM_MEMORY_MAX_TOKENS:2048}
  mcp:
    clickhouse:
      enabled: ${AGENT_CLICKHOUSE_MCP_ENABLED:true}
      fallback-to-jdbc-on-error: true
      executable: ${AGENT_CLICKHOUSE_MCP_EXECUTABLE:uvx}
      arguments:
        - mcp-clickhouse
      request-timeout: 30s
      startup-timeout: 10s
      verify-ssl: true
      connect-timeout-seconds: 10
      send-receive-timeout-seconds: 30
  email:
    from: ${AGENT_EMAIL_FROM:${MAIL_USERNAME:}}

# LangChain4j OpenAI 兼容协议说明：
# - chat-completions: 默认，适用于标准 /v1/chat/completions
# - responses: 适用于只支持 /v1/responses 的中转站
# - DashScope/Qwen: 也走 chat-completions，base-url 使用
#   https://dashscope.aliyuncs.com/compatible-mode/v1
# 生产环境建议仍通过环境变量或本地忽略文件覆盖，而不是直接把 key 写在这里。

# ClickHouse MCP 使用说明：
# - 仅对 clickhouse 类型数据源生效
# - enabled=true 且 executable 非空时，ClickHouse 查询优先走官方 mcp-clickhouse
# - 后端现在使用官方 Java SDK 的 STDIO client，不再手写 JSON-RPC 协议
# - arguments 建议放在 application-local.yml，例如:
#   agent:
#     mcp:
#       clickhouse:
#         executable: uvx
#         arguments:
#           - mcp-clickhouse

# Spring Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

# 日志配置
logging:
  file:
    name: logs/log-analysis-app.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 1GB
  level:
    dev:
      langchain4j: debug
    root: INFO
    #cn.mw.loganalysis: DEBUG
    #org.springframework.security: DEBUG
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){magenta} %clr([%X{traceId}]){yellow} %clr(%-5level){highlight} %clr(%logger{36}){cyan} %clr(-){faint} %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
